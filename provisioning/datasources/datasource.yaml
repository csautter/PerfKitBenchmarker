apiVersion: 1

datasources:
  - name: InfluxDB_v1
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      dbName: perfkit
      httpMode: GET
  - name: Elastic_v8
    type: elasticsearch
    access: proxy
    url: http://elastic:9200
    jsonData:
      index: 'perfkit'
      timeField: 'timestamp'